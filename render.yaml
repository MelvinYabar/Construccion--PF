services:
  - type: web
    name: parmenia-api
    runtime: python
    plan: free
    # Python 3.13 — necesario porque pydantic-core aún no tiene wheels precompilados
    # para Python 3.14 (que es el default actual de Render). Sin esto, el build
    # intenta compilar pydantic-core desde el código fuente con Rust y falla.
    pythonVersion: "3.13.7"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: parmenia
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SCOPE
        value: openid email profile
      - key: FRONTEND_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
